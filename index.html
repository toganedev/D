<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>曲再生サイト</title>

  <link rel="icon" type="image/png" href="https://raw.githubusercontent.com/toganedev/D/main/discord_icon.png">
  <link rel="apple-touch-icon" href="https://raw.githubusercontent.com/toganedev/D/main/discord_icon.png">
  <link rel="manifest" href="manifest.json">

  <style>
    body {
      background-color: #f7f3e9;
      font-family: sans-serif;
      color: #333;
      margin: 0;
      padding: 0;
    }
    header {
      background-color: #8bbccc;
      padding: 1rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      color: #fff;
    }
    header h1 { margin: 0; }
    .creator-card {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .creator-card img {
      width: 32px;
      height: 32px;
      border-radius: 50%;
    }
    main {
      max-width: 900px;
      margin: auto;
      padding: 1.5rem;
    }
    ul { list-style: none; padding: 0; }
    li { margin: 0.4rem 0; }
    a {
      color: #5a7d9a;
      text-decoration: none;
      font-weight: bold;
    }
    a:hover { text-decoration: underline; }
    audio {
      width: 100%;
      margin-top: 1.5rem;
    }
    .controls {
      margin-bottom: 1rem;
      display: flex;
      gap: 0.5rem;
      flex-wrap: wrap;
    }
    .controls button {
      background-color: #8bbccc;
      border: none;
      color: white;
      padding: 0.4rem 0.8rem;
      cursor: pointer;
      border-radius: 4px;
      font-size: 14px;
    }
    .controls button:hover { background-color: #7aa9b6; }
    .search-bar { margin-bottom: 1rem; }
    .search-bar input {
      padding: 0.4rem;
      font-size: 14px;
      border-radius: 4px;
      border: 1px solid #ccc;
      width: 100%;
      box-sizing: border-box;
    }
    #auth {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
    }
    #auth input, #auth button {
      padding: 8px;
      margin-top: 8px;
      font-size: 14px;
      border-radius: 4px;
      border: 1px solid #ccc;
    }
    #auth button {
      background-color: #8bbccc;
      color: #fff;
      border: none;
      cursor: pointer;
    }
    .now-playing {
      margin-top: 1rem;
      font-weight: bold;
      white-space: pre-line;
    }
    #video-player {
      position: fixed;
      bottom: 10px;
      right: 10px;
      width: 300px;
      height: 170px;
      background: #000;
      display: none;
      z-index: 1000;
    }
    #video-player video {
      width: 100%;
      height: 100%;
      border: none;
      background: #000;
    }
    #pip-btn {
      position: absolute;
      top: 5px;
      right: 5px;
      background: rgba(255,255,255,0.7);
      border: none;
      padding: 2px 6px;
      cursor: pointer;
      font-size: 16px;
      border-radius: 4px;
    }
    footer {
      text-align: center;
      padding: 1rem;
      font-size: 12px;
      color: #666;
    }

    /* 歌詞モーダル */
    #lyrics-modal {
      display: none;
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.7);
      z-index: 2000;
      justify-content: center;
      align-items: center;
    }
    #lyrics-box {
      background: #fff;
      max-width: 600px;
      width: 90%;
      max-height: 80vh;
      padding: 1rem;
      border-radius: 8px;
      overflow-y: auto;
      white-space: pre-line;
    }
    #lyrics-box h3 {
      margin-top: 0;
      text-align: center;
    }
    .lyrics-btn {
      margin-left: 8px;
      border: none;
      background: #8bbccc;
      color: #fff;
      padding: 2px 6px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 12px;
    }
    .lyrics-btn:hover {
      background: #7aa9b6;
    }
  </style>
</head>
<body>

<div id="auth">
  <h2>パスワードを入力してください</h2>
  <input type="password" id="password" placeholder="Password">
  <button onclick="checkPassword()">送信</button>
</div>

<div id="main-content" style="display:none;">
  <header>
    <h1>曲再生サイト</h1>
    <div class="creator-card">
      <img src="https://raw.githubusercontent.com/toganedev/D/main/discord_icon.png" alt="icon">
      <div>
        <div>togane_dev</div>
        <div style="font-size:12px;">1401421639106957464</div>
      </div>
    </div>
  </header>
  <main>
    <div class="controls">
      <button onclick="playRandom()">ランダム</button>
      <button onclick="prevTrack()">戻る</button>
      <button onclick="nextTrack()">スキップ</button>
      <button onclick="toggleRepeat()" id="repeat-btn">リピートOFF</button>
      <button onclick="toggleFavorites()" id="favorites-btn">⭐ お気に入りだけ</button>
    </div>
    <div class="search-bar">
      <input type="text" id="search" placeholder="曲名検索..." oninput="filterTracks()">
    </div>
    <div class="now-playing" id="now-playing">再生中: なし\n次の曲: なし</div>
    <h2>曲一覧</h2>
    <ul id="track-list">読み込み中...</ul>
    <audio id="player" controls></audio>
  </main>
</div>

<div id="video-player">
  <video id="video-frame" muted playsinline webkit-playsinline></video>
  <button id="pip-btn">📺</button>
</div>

<!-- 歌詞モーダル -->
<div id="lyrics-modal">
  <div id="lyrics-box">
    <h3>歌詞</h3>
    <div id="lyrics-content"></div>
  </div>
</div>

<footer>
  ver1.5
</footer>

<script>
let tracks = [];
let currentList = []; // 再生対象のリスト
let currentIndex = 0;
let isRepeat = false;
const repoOwner = "toganedev";
const repoName = "D";
const baseURL = `https://raw.githubusercontent.com/${repoOwner}/${repoName}/main/`;

let favorites = JSON.parse(localStorage.getItem("favorites") || "[]");
let showFavoritesOnly = false;
let lyricsData = [];

async function checkPassword() {
  const input = document.getElementById("password").value.trim();
  if (!input) {
    alert("パスワードを入力してください");
    return;
  }
  const res = await fetch(baseURL + "password.txt");
  const text = await res.text();
  const lines = text.split(/\r?\n/).map(l => l.trim()).filter(l => l !== "");
  if (lines.includes(input)) {
    document.getElementById("auth").style.display = "none";
    document.getElementById("main-content").style.display = "block";
    loadTracks();
    loadLyrics();
  } else {
    alert("パスワードが違います");
  }
}

document.getElementById("password").addEventListener("keydown", e => {
  if (e.key === "Enter") checkPassword();
});

async function loadTracks() {
  const res = await fetch(`https://api.github.com/repos/${repoOwner}/${repoName}/contents`);
  const files = await res.json();
  tracks = files
    .filter(file => file.name.endsWith(".mp4") || file.name.endsWith(".m4a"))
    .map(file => decodeURIComponent(file.name));
  currentList = [...tracks];
  renderTrackList();
}

async function loadLyrics() {
  try {
    const res = await fetch(baseURL + "kashi.json");
    lyricsData = await res.json();
  } catch (e) {
    console.error("歌詞データ読み込み失敗:", e);
  }
}

function renderTrackList() {
  const listContainer = document.getElementById("track-list");
  listContainer.innerHTML = "";

  if (currentList.length === 0) {
    listContainer.innerHTML = "<li>曲がありません</li>";
    return;
  }

  currentList.forEach((file) => {
    const li = document.createElement("li");

    const link = document.createElement("a");
    link.href = "#";
    link.textContent = file;
    link.addEventListener("click", e => {
      e.preventDefault();
      playTrack(currentList.indexOf(file));
    });

    const favBtn = document.createElement("button");
    favBtn.textContent = favorites.includes(file) ? "⭐" : "☆";
    favBtn.style.marginLeft = "8px";
    favBtn.style.border = "none";
    favBtn.style.background = "transparent";
    favBtn.style.cursor = "pointer";
    favBtn.addEventListener("click", e => {
      e.stopPropagation();
      toggleFavorite(file);
    });

    const lyricsBtn = document.createElement("button");
    lyricsBtn.textContent = "歌詞";
    lyricsBtn.className = "lyrics-btn";
    lyricsBtn.addEventListener("click", e => {
      e.stopPropagation();
      showLyrics(file);
    });

    li.appendChild(link);
    li.appendChild(favBtn);
    li.appendChild(lyricsBtn);
    listContainer.appendChild(li);
  });
}

function toggleFavorite(track) {
  if (favorites.includes(track)) {
    favorites = favorites.filter(f => f !== track);
  } else {
    favorites.push(track);
  }
  localStorage.setItem("favorites", JSON.stringify(favorites));
  renderTrackList();
}

function toggleFavorites() {
  showFavoritesOnly = !showFavoritesOnly;
  document.getElementById("favorites-btn").textContent = showFavoritesOnly ? "📂 全曲表示" : "⭐ お気に入りだけ";
  currentList = showFavoritesOnly ? [...favorites] : [...tracks];
  renderTrackList();
}

function playTrack(index) {
  if (index < 0 || index >= currentList.length) return;
  currentIndex = index;
  const trackName = currentList[index];
  const url = baseURL + encodeURIComponent(trackName);

  const audioPlayer = document.getElementById("player");
  const videoFrame = document.getElementById("video-frame");
  const videoPlayer = document.getElementById("video-player");

  audioPlayer.src = url;
  videoFrame.src = url;

  audioPlayer.play();
  videoFrame.play();

  videoPlayer.style.display = "block";
  updateNowPlaying();

  audioPlayer.onended = () => {
    if (isRepeat) {
      audioPlayer.currentTime = 0;
      audioPlayer.play();
      videoFrame.currentTime = 0;
      videoFrame.play();
    } else {
      videoPlayer.style.display = "none";
      nextTrack();
    }
  };
}

function updateNowPlaying() {
  const now = currentList[currentIndex] || "なし";
  const next = currentList[(currentIndex + 1) % currentList.length] || "なし";
  document.getElementById("now-playing").textContent = `再生中: ${now}\n次の曲: ${next}`;
}

function nextTrack() { playTrack((currentIndex + 1) % currentList.length); }
function prevTrack() { playTrack((currentIndex - 1 + currentList.length) % currentList.length); }
function playRandom() {
  const randomIndex = Math.floor(Math.random() * currentList.length);
  playTrack(randomIndex);
}

function filterTracks() {
  const query = document.getElementById("search").value.toLowerCase();
  let base = showFavoritesOnly ? favorites : tracks;
  currentList = base.filter(t => t.toLowerCase().includes(query));
  renderTrackList();
}

function toggleRepeat() {
  isRepeat = !isRepeat;
  document.getElementById("repeat-btn").textContent = isRepeat ? "リピートON" : "リピートOFF";
}

document.getElementById("pip-btn").addEventListener("click", async () => {
  const video = document.getElementById("video-frame");
  if (document.pictureInPictureElement) {
    await document.exitPictureInPicture();
  } else {
    await video.requestPictureInPicture();
  }
});

// 歌詞表示
function showLyrics(track) {
  const match = lyricsData.find(item => item.file === track);
  if (match) {
    document.getElementById("lyrics-content").textContent = match.lyrics;
    document.getElementById("lyrics-modal").style.display = "flex";
  } else {
    alert("この曲の歌詞は登録されていません");
  }
}

// モーダル閉じる処理
document.getElementById("lyrics-modal").addEventListener("click", e => {
  if (e.target.id === "lyrics-modal") {
    document.getElementById("lyrics-modal").style.display = "none";
  }
});
</script>
</body>
</html>
