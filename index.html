<!DOCTYPE html>
<html lang="ja">
<head>

<link rel="apple-touch-icon" href="https://raw.githubusercontent.com/toganedev/D/refs/heads/main/aa.jpg">

  <style>
    body {
      background-color: #f7f3e9;
      font-family: sans-serif;
      color: #333;
      margin: 0;
      padding: 0;
    }
    header {
      background-color: #8bbccc;
      padding: 1rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      color: #fff;
    }
    header h1 { margin: 0; }
    .creator-card {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .creator-card img {
      width: 32px;
      height: 32px;
      border-radius: 50%;
    }
    main {
      max-width: 900px;
      margin: auto;

    }
    ul { list-style: none; padding: 0; margin: 0; }
    li { margin: 0.4rem 0; }

    }

    audio {

      content: "▶";

    /* === ダークモード === */
body.dark-mode {
  background-color: #000;
  color: #0ff; /* 蛍光シアン */
}

body.dark-mode header {
  background: linear-gradient(90deg, #0ff, #f0f, #0f0);
  color: #000;
}

body.dark-mode a {
  color: #0ff;
  text-shadow: 0 0 8px #0ff;
}

body.dark-mode .controls button {
  background: transparent;
  border: 1px solid #0ff;
  color: #0ff;
  box-shadow: 0 0 10px #0ff, 0 0 20px #0ff inset;
}

body.dark-mode .controls button:hover {
  background: #0ff;
  color: #000;
  text-shadow: none;
}

body.dark-mode #lyrics-box {
  background: #111;
  color: #0ff;
  border: 1px solid #0ff;
  box-shadow: 0 0 15px #0ff;
}
/* === Spotify風モード === */
body.spotify-mode {
  background-color: #121212;
  color: #fff;
  font-family: "Helvetica Neue", Arial, sans-serif;
  padding-bottom: 90px; /* 下のバーの高さ分余白を確保 */
}

/* ヘッダーは黒に */
body.spotify-mode header {
  background-color: #181818;
  color: #fff;
}

/* 曲リストのリンク */
body.spotify-mode a {
  color: #fff;
}
body.spotify-mode a:hover {

}

/* 下部プレイヤーバー */

}

/* 左側：曲情報 */

}
body.spotify-mode .sp-left img {

}
body.spotify-mode .sp-title {

}

/* 中央：操作ボタン群 */
body.spotify-mode .sp-center {

  gap: 6px;
}
body.spotify-mode .sp-controls {
  display: flex;

}
body.spotify-mode .sp-controls button {
  background: none;
  border: none;
  color: #b3b3b3;
  font-size: 20px;
  cursor: pointer;
}
body.spotify-mode .sp-controls button:hover {
  color: #fff;
}
body.spotify-mode .sp-controls .play-btn {
  font-size: 32px;
  color: #fff;
}

/* 再生バー（ダミー進捗用） */
body.spotify-mode .sp-progress {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 11px;
  color: #b3b3b3;
}
body.spotify-mode .sp-progress input[type=range] {
  flex: 1;

}

  width: 12px;
  height: 12px;

}

/* 右側：音量など */
body.spotify-mode .sp-right {

  align-items: center;

body.spotify-mode .sp-right input[type=range] {

}
body.spotify-mode .sp-right input[type=range]::-webkit-slider-thumb {
  appearance: none;
  width: 12px;

  border-radius: 50%;

  cursor: pointer;
}
/* === PiP位置調整 (Spotifyバーと被らないように) === */
#video-player {
  bottom: 110px; /* 元の10pxから変更 */
}

/* === 曲名スクロール (Spotify風バー) === */
body.spotify-mode .sp-title {

  }

  }

    width: 80px;
  }

  /* スタート/リピートボタン調整 */

    font-size: 12px;
    padding: 0.3rem 0.6rem;
  }
}
/* 通常（PC含む） */
#video-player {
  bottom: 10px;
}

/* Spotify風 + スマホ画面だけ上げる */
@media (max-width: 768px) {
  body.spotify-mode #video-player {
    bottom: calc(90px + 20px + env(safe-area-inset-bottom, 0));
  }
}
 /* === Spotify風バー 曲名スクロール修正版 === */
  body.spotify-mode .sp-title {
    position: relative;
    display: block;
    width: 160px;
    height: 20px;
    overflow: hidden;
    white-space: nowrap;
  }
body.spotify-mode .sp-title span {
  display: inline-block;
  padding-left: 100%; /* 右外から出発 */
  animation: scroll-text 12s linear infinite;
}

@keyframes scroll-text {
  0%   { transform: translateX(0); }
  10%  { transform: translateX(0); } /* 右で一時停止 */
  90%  { transform: translateX(calc(-1 * var(--scroll-distance))); }
  100% { transform: translateX(calc(-1 * var(--scroll-distance))); } /* 左で停止後リセット */
}

<script>

  // === キーボードショートカット ===
document.addEventListener("keydown", (e) => {
  if (e.target.tagName === "INPUT" || e.target.tagName === "TEXTAREA") return; // 入力中は無効化

  switch (e.key) {
    case " ": // スペース
      e.preventDefault();
      const player = document.getElementById("player");
      if (player.paused) {
        resumePlayback();
      } else {
        stopPlayback();
      }
      break;

    case "ArrowRight": // 次の曲
      nextTrack();
      break;

    case "ArrowLeft": // 前の曲
      prevTrack();
      break;

    case "r": // リピート切替
    case "R":
      toggleRepeat();
      break;

    case "f": // お気に入りモード切替
    case "F":
      toggleFavorites();
      break;

    case "l": // 歌詞を開く（今の曲が対応していれば）
    case "L":
      const nowTrack = currentList[currentIndex];
      if (nowTrack) {
        const fileName = nowTrack.split("/").pop();
        showLyrics(fileName);
      }
      break;
  }
});
  
let tracks = []; 
let currentList = [];
let currentIndex = 0;
let isRepeat = false;
let nextTrackKey = null;
const repoOwner = "toganedev";
const repoName = "D";
const baseURL = `https://raw.githubusercontent.com/${repoOwner}/${repoName}/main/`;

let favorites = JSON.parse(localStorage.getItem("favorites") || "[]");
let showFavoritesOnly = false;
let lyricsData = [];
let playHistory = [];  // 再生履歴を保存する配列
let allTracksFromJson = []; 

// === 時刻表示 ===
function updateJapanTime() {
  const now = new Date().toLocaleString("ja-JP", { timeZone: "Asia/Tokyo" });
  document.getElementById("japan-time").textContent = now;
}
setInterval(updateJapanTime, 1000);

// === 曲一覧読み込み ===
async function loadTracks() {
  const listContainer = document.getElementById("track-list");
  listContainer.innerHTML = "";

  try {
    const res = await fetch("https://api.github.com/repos/toganedev/D/contents/");
    if (!res.ok) throw new Error("GitHub API 失敗");

    const data = await res.json();
    const files = flattenFiles(data);

    // ←ここで必ず allTracksFromJson に入れる
    allTracksFromJson = files;

    renderTrackList(files, listContainer);
  } catch (err) {
    console.warn("GitHub APIエラー、tracks.jsonから読み込み:", err);

    try {
      const res = await fetch(baseURL + "tracks.json");
      if (!res.ok) throw new Error("tracks.jsonが読めない");
      const data = await res.json();

      allTracksFromJson = data; // ←ここも追加！
      renderTrackList(data, listContainer);
    } catch (jsonErr) {
      console.error("tracks.json読み込みエラー:", jsonErr);
      listContainer.textContent = "曲一覧の読み込みに失敗しました。";
    }
  }
}


// === GitHub APIの再帰処理（簡易版） ===
function flattenFiles(items, parent = "") {
  let result = [];
  items.forEach(item => {
    if (item.type === "file" && (item.name.endsWith(".mp4") || item.name.endsWith(".m4a"))) {
      result.push(parent + item.name);
    }
    // ※サブフォルダはここでは無視（tracks.json fallbackで対応）
  });
  return result;
}

// === フォルダ分けしてDOM描画 ===

// 1曲ぶんの <li> を作る共通関数
function createTrackListItem(fullKey) {
  const fileName = fullKey.split("/").pop();
  const li = document.createElement("li");

  // 曲リンク
  const link = document.createElement("a");
  link.href = "#";
  link.textContent = fileName;
  link.addEventListener("click", e => {
    e.preventDefault();
    playTrack(baseURL + fullKey, fullKey);
  });
  li.appendChild(link);

  // ⭐ お気に入りボタン
  const favBtn = document.createElement("button");
  favBtn.textContent = favorites.includes(fullKey) ? "⭐" : "☆";
  favBtn.className = "fav-btn";
  favBtn.addEventListener("click", e => {
    e.stopPropagation();
    toggleFavorite(fullKey);
    favBtn.textContent = favorites.includes(fullKey) ? "⭐" : "☆";
  });
  li.appendChild(favBtn);

  // 歌詞ボタン（lyricsDataにあるかチェック）
  const hasLyrics = lyricsData.some(entry => entry.file === fileName);
  if (hasLyrics) {
    const lyricsBtn = document.createElement("button");
    lyricsBtn.textContent = "歌詞";
    lyricsBtn.className = "lyrics-btn";
    lyricsBtn.addEventListener("click", e => {
      e.stopPropagation();
      showLyrics(fileName);
    });
    li.appendChild(lyricsBtn);
  }

  return li;
}

function renderTrackList(filePaths, container) {
  const folders = {};

  filePaths.forEach(path => {
    if (!tracks.includes(path)) tracks.push(path); // tracksにも追加

    const firstSlash = path.indexOf("/");
    if (firstSlash === -1) {
      if (!folders["その他"]) folders["その他"] = [];
      folders["その他"].push(path);
    } else {
      const folder = path.substring(0, firstSlash);
      if (!folders[folder]) folders[folder] = [];
      folders[folder].push(path);
    }
  });

  Object.keys(folders).forEach(folder => {
    const li = document.createElement("li");
    const folderDiv = document.createElement("div");
    folderDiv.textContent = folder;
    folderDiv.className = "folder";

    const nested = document.createElement("ul");
    nested.className = "nested";

    folderDiv.addEventListener("click", () => {
      folderDiv.classList.toggle("open");
      nested.classList.toggle("open");
    });

    li.appendChild(folderDiv);
    li.appendChild(nested);
    container.appendChild(li);

    folders[folder].forEach(fullKey => {
      const trackLi = createTrackListItem(fullKey);
      nested.appendChild(trackLi);
    });
  });
}

function renderFromJson(trackArray, parentElement) {
  trackArray.forEach(fullKey => {
    const trackLi = createTrackListItem(fullKey);
    parentElement.appendChild(trackLi);
  });
}


function getActiveList() {
  const openFolder = document.querySelector(".nested.open");
  if (openFolder) {
    const localTracks = [];
    openFolder.querySelectorAll("li a").forEach(link => {
      const fileKey = tracks.find(t => t.endsWith(link.textContent));
      if (fileKey) localTracks.push(fileKey);
    });
    return localTracks;
  }
  // フォルダ未選択なら tracks.json の全曲を使う
  return showFavoritesOnly ? favorites : (allTracksFromJson.length ? allTracksFromJson : tracks);
}


async function playTrack(url, fileKey) {
  if (!isRepeat && (playHistory.length === 0 || playHistory[playHistory.length - 1] !== fileKey)) {
    playHistory.push(fileKey);
  }

  currentList = getActiveList();
  currentIndex = currentList.indexOf(fileKey);

  const audioPlayer = document.getElementById("player");
  const videoFrame = document.getElementById("video-frame");
  const videoPlayer = document.getElementById("video-player");

  audioPlayer.src = url;
  audioPlayer.play();

  videoFrame.src = url;
  videoFrame.load();
  videoFrame.onloadedmetadata = () => {
    videoFrame.currentTime = 0;
    videoFrame.play().catch(err => console.warn("video autoplay error:", err));
  };
  videoPlayer.style.display = "block";

  if (!isRepeat) {
    if (isRandomMode) {
      const list = getActiveList();
      if (list.length > 1) {
        let nextIdx;
        do {
          nextIdx = Math.floor(Math.random() * list.length);
        } while (list[nextIdx] === fileKey);
        nextTrackKey = list[nextIdx];
      } else {
        nextTrackKey = fileKey;
      }
    } else {
      if (currentIndex >= 0 && currentIndex < currentList.length - 1) {
        nextTrackKey = currentList[currentIndex + 1];
      } else {
        nextTrackKey = currentList[0];
      }
    }
  }

  updateNowPlaying(fileKey);
  updateMediaSession(fileKey, url);

  audioPlayer.onended = () => {
    if (isRepeat) {
      playTrack(url, fileKey);
    } else if (isRandomMode) {
      playRandom();
    } else if (nextTrackKey) {
      playTrack(baseURL + nextTrackKey, nextTrackKey);
    } else {
      videoPlayer.style.display = "none";
    }
  };
}


let isRandomMode = false;
// === ランダム再生 ===
function playRandom() {
  const all = getActiveList();
  if (all.length === 0) return;
  isRandomMode = true;

  // ランダムで現在の曲を決定
  let randomIndex = Math.floor(Math.random() * all.length);
  const currentKey = all[randomIndex];

  // 次の曲を先に決めておく
  if (all.length > 1) {
    let nextIdx;
    do {
      nextIdx = Math.floor(Math.random() * all.length);
    } while (nextIdx === randomIndex); // 同じ曲を避ける
    nextTrackKey = all[nextIdx];
  } else {
    nextTrackKey = currentKey;
  }

  playTrack(baseURL + currentKey, currentKey);
}

// === 次の曲 ===
function nextTrack() {
  if (currentList.length === 0) return;
  if (isRepeat) {
    playTrack(baseURL + currentList[currentIndex], currentList[currentIndex]);
    return;
  }
  if (isRandomMode) {
    // ランダム時は nextTrackKey に進む
    if (nextTrackKey) {
      playTrack(baseURL + nextTrackKey, nextTrackKey);
    } else {
      playRandom();
    }
  } else {
    if (currentIndex >= 0 && currentIndex < currentList.length - 1) {
      const nextKey = currentList[currentIndex + 1];
      playTrack(baseURL + nextKey, nextKey);
    } else {
      const firstKey = currentList[0];
      playTrack(baseURL + firstKey, firstKey);
    }
  }
}

// === 前の曲 ===
function prevTrack() {
  if (currentList.length === 0) return;
  if (isRepeat) {
    playTrack(baseURL + currentList[currentIndex], currentList[currentIndex]);
    return;
  }
  if (isRandomMode) {
    // ランダム時は履歴から戻す
    if (playHistory.length > 1) {
      playHistory.pop(); // 現在を削除
      const prevKey = playHistory.pop(); // その前を取得
      if (prevKey) playTrack(baseURL + prevKey, prevKey);
    } else {
      alert("前の曲はありません");
    }
  } else {
    if (currentIndex > 0) {
      const prevKey = currentList[currentIndex - 1];
      playTrack(baseURL + prevKey, prevKey);
    } else {
      const lastKey = currentList[currentList.length - 1];
      playTrack(baseURL + lastKey, lastKey);
    }
  }
}

// === リピート切替 ===
function toggleRepeat() {
  isRepeat = !isRepeat;
  document.getElementById("repeat-btn").textContent = isRepeat ? "リピートON" : "リピートOFF";
}

// === スタート再生（順番再生）===
function startPlayback() {
  currentList = getActiveList();
  if (currentList.length === 0) return;
  isRandomMode = false;
  const firstKey = currentList[0];
  playTrack(baseURL + firstKey, firstKey);
}

// === ストップ ===
function stopPlayback() {
  const p = document.getElementById("player");
  const v = document.getElementById("video-frame");
  if (p) p.pause();
  if (v) v.pause();
}
// === 続きから再生 ===
function resumePlayback() {
  const p = document.getElementById("player");
  const v = document.getElementById("video-frame");
  if (p && p.src) {
    p.play();
  }
  if (v && v.src) {
    v.play();
  }
}

// === 歌詞 ===
async function loadLyrics() {
  try {
    const res = await fetch(baseURL + "kashi.json");
    lyricsData = await res.json();
  } catch (e) {
    console.error("歌詞データ読み込み失敗:", e);
  }
}
function showLyrics(fileName) {
  const entry = lyricsData.find(e => e.file === fileName);
  if (entry) {
    document.getElementById("lyrics-content").textContent = entry.lyrics;
    document.getElementById("lyrics-modal").style.display = "flex";
  }
}
document.getElementById("lyrics-modal").addEventListener("click", () => {
  document.getElementById("lyrics-modal").style.display = "none";
});

// === お気に入り ===
function toggleFavorite(track) {
  if (favorites.includes(track)) {
    favorites = favorites.filter(f => f !== track);
  } else {
    favorites.push(track);
  }
  localStorage.setItem("favorites", JSON.stringify(favorites));

  if (showFavoritesOnly) renderFavorites();
}

function toggleFavorites() {
  showFavoritesOnly = !showFavoritesOnly;
  document.getElementById("favorites-btn").textContent = showFavoritesOnly ? "📂 全曲表示" : "⭐ お気に入りだけ";
  if (showFavoritesOnly) renderFavorites();
  else loadTracks();
}

function renderFavorites() {
  const listContainer = document.getElementById("track-list");
  listContainer.innerHTML = "";
  favorites.forEach(file => {
    const fileName = file.split("/").pop();
    const li = document.createElement("li");
    const link = document.createElement("a");
    link.href = "#";
    link.textContent = fileName;
    link.addEventListener("click", e => {
      e.preventDefault();
      playTrack(baseURL + file, file);
    });
    const favBtn = document.createElement("button");
    favBtn.textContent = "⭐";
    favBtn.style.marginLeft = "8px";
    favBtn.style.border = "none";
    favBtn.style.background = "transparent";
    favBtn.style.cursor = "pointer";
    favBtn.addEventListener("click", e => {
      e.stopPropagation();
      toggleFavorite(file);
      favBtn.textContent = favorites.includes(file) ? "⭐" : "☆";
    });
    li.appendChild(link);
    li.appendChild(favBtn);

    const hasLyrics = lyricsData.some(entry => entry.file === fileName);
    if (hasLyrics) {
      const lyricsBtn = document.createElement("button");
      lyricsBtn.textContent = "歌詞";
      lyricsBtn.className = "lyrics-btn";
      lyricsBtn.addEventListener("click", e => {
        e.stopPropagation();
        showLyrics(fileName);
      });
      li.appendChild(lyricsBtn);
    }

    listContainer.appendChild(li);
  });
}

// === 検索 ===
function filterTracks() {
  const query = document.getElementById("search").value.toLowerCase();
  const listContainer = document.getElementById("track-list");

  if (!query) {
    // 検索が空 → 通常のツリーを表示
    loadTracks();
    return;
  }

  listContainer.innerHTML = "";

  // 全曲リストを対象にする（favoritesモードならfavorites）
  const targetTracks = showFavoritesOnly
    ? favorites
    : (allTracksFromJson.length ? allTracksFromJson : tracks);

  const results = targetTracks.filter(fullKey =>
    fullKey.toLowerCase().includes(query)
  );

  if (results.length === 0) {
    listContainer.textContent = "該当する曲が見つかりません。";
    return;
  }

  results.forEach(fullKey => {
    const fileName = fullKey.split("/").pop();
    const li = document.createElement("li");

    const link = document.createElement("a");
    link.href = "#";
    link.textContent = fileName;
    link.addEventListener("click", e => {
      e.preventDefault();
      playTrack(baseURL + fullKey, fullKey);
    });

    const favBtn = document.createElement("button");
    favBtn.textContent = favorites.includes(fullKey) ? "⭐" : "☆";
    favBtn.style.marginLeft = "8px";
    favBtn.style.border = "none";
    favBtn.style.background = "transparent";
    favBtn.style.cursor = "pointer";
    favBtn.addEventListener("click", e => {
      e.stopPropagation();
      toggleFavorite(fullKey);
      favBtn.textContent = favorites.includes(fullKey) ? "⭐" : "☆";
    });

    li.appendChild(link);
    li.appendChild(favBtn);

    const hasLyrics = lyricsData.some(entry => entry.file === fileName);
    if (hasLyrics) {
      const lyricsBtn = document.createElement("button");
      lyricsBtn.textContent = "歌詞";
      lyricsBtn.className = "lyrics-btn";
      lyricsBtn.addEventListener("click", e => {
        e.stopPropagation();
        showLyrics(fileName);
      });
      li.appendChild(lyricsBtn);
    }

    listContainer.appendChild(li);
  });
}

// === メディアセッション ===
function updateMediaSession(fileKey) {
  if ("mediaSession" in navigator) {
    navigator.mediaSession.metadata = new MediaMetadata({
      title: fileKey.split("/").pop(),
      artist: "togane_dev",
      album: "GitHub Music",
      artwork: [
        {
          src: "https://raw.githubusercontent.com/toganedev/D/refs/heads/main/aa.jpg",
          sizes: "512x512",
          type: "image/jpeg",
        },
      ],
    });

    navigator.mediaSession.setActionHandler("play", () => startPlayback());
    navigator.mediaSession.setActionHandler("pause", () => stopPlayback());
    navigator.mediaSession.setActionHandler("previoustrack", () => prevTrack());
    navigator.mediaSession.setActionHandler("nexttrack", () => nextTrack());
  }
}

// === Spotify風バーのシーク・音量同期 ===
document.addEventListener("DOMContentLoaded", () => {
  const player = document.getElementById("player");
  const spSeek = document.getElementById("sp-seek");
  const spCurrent = document.getElementById("sp-current");
  const spDuration = document.getElementById("sp-duration");
  const spVolume = document.getElementById("sp-volume");
  const spBtn = document.getElementById("sp-playpause");

  // 再生・停止ボタンの同期
  function updatePlayButton() {
    spBtn.textContent = player.paused ? "▶" : "⏸";
  }
  player.addEventListener("play", updatePlayButton);
  player.addEventListener("pause", updatePlayButton);

  spBtn.addEventListener("click", () => {
    if (player.paused) {
      resumePlayback();
    } else {
      stopPlayback();
    }
  });

  // 再生中にシークバー更新
  player.addEventListener("timeupdate", () => {
    if (!isNaN(player.duration)) {
      spSeek.max = player.duration;
      spSeek.value = player.currentTime;
    }
    spCurrent.textContent = formatTime(player.currentTime);
    spDuration.textContent = formatTime(player.duration);
  });

  // シークバー操作
  spSeek.addEventListener("input", () => {
    player.currentTime = spSeek.value;
  });

  // 音量操作
  spVolume.addEventListener("input", () => {
    player.volume = spVolume.value;
  });

  // 初期音量を同期
  spVolume.value = player.volume;

  function formatTime(sec) {
    if (!sec || isNaN(sec)) return "0:00";
    const m = Math.floor(sec / 60);
    const s = Math.floor(sec % 60).toString().padStart(2, "0");
    return `${m}:${s}`;
  }
});
// === 曲名スクロール調整 ===
function applyScrollingToTitle() {
  const spTitle = document.querySelector("#sp-title span");
  if (!spTitle) return;

  const container = spTitle.parentElement;
  const textWidth = spTitle.scrollWidth;
  const containerWidth = container.clientWidth;

  if (textWidth > containerWidth) {
    const distance = textWidth - containerWidth; // はみ出し量
    spTitle.style.animation = `scroll-text 12s linear infinite`;
    spTitle.style.setProperty("--scroll-distance", `${distance}px`);
  } else {
    spTitle.style.animation = "none"; // 短い曲名ならスクロール不要
  }
}
