<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>曲再生サイト</title>

  <link rel="icon" type="image/png" href="https://raw.githubusercontent.com/toganedev/D/main/discord_icon.png">
  <link rel="apple-touch-icon" href="https://raw.githubusercontent.com/toganedev/D/main/discord_icon.png">
  <link rel="manifest" href="manifest.json">

  <style>
    body {
      background-color: #f7f3e9;
      font-family: sans-serif;
      color: #333;
      margin: 0;
      padding: 0;
    }
    header {
      background-color: #8bbccc;
      padding: 1rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      color: #fff;
    }
    header h1 { margin: 0; }
    .creator-card {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .creator-card img {
      width: 32px;
      height: 32px;
      border-radius: 50%;
    }
    main {
      max-width: 900px;
      margin: auto;
      padding: 1.5rem;
    }
    ul { list-style: none; padding: 0; margin: 0; }
    li { margin: 0.4rem 0; }
    a {
      color: #5a7d9a;
      text-decoration: none;
      font-weight: bold;
    }
    a:hover { text-decoration: underline; }
    audio {
      width: 100%;
      margin-top: 1.5rem;
    }
    .controls {
      margin-bottom: 1rem;
      display: flex;
      gap: 0.5rem;
      flex-wrap: wrap;
    }
    .controls button {
      background-color: #8bbccc;
      border: none;
      color: white;
      padding: 0.4rem 0.8rem;
      cursor: pointer;
      border-radius: 4px;
      font-size: 14px;
    }
    .controls button:hover { background-color: #7aa9b6; }
    .search-bar { margin-bottom: 1rem; }
    .search-bar input {
      padding: 0.4rem;
      font-size: 14px;
      border-radius: 4px;
      border: 1px solid #ccc;
      width: 100%;
      box-sizing: border-box;
    }
    #auth {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
    }
    #auth input, #auth button {
      padding: 8px;
      margin-top: 8px;
      font-size: 14px;
      border-radius: 4px;
      border: 1px solid #ccc;
    }
    #auth button {
      background-color: #8bbccc;
      color: #fff;
      border: none;
      cursor: pointer;
    }
    .now-playing {
      margin-top: 1rem;
      font-weight: bold;
      white-space: pre-line;
    }
    #video-player {
      position: fixed;
      bottom: 10px;
      right: 10px;
      width: 300px;
      height: 170px;
      background: #000;
      display: none;
      z-index: 1000;
    }
    #video-player video {
      width: 100%;
      height: 100%;
      border: none;
      background: #000;
    }
    #pip-btn {
      position: absolute;
      top: 5px;
      right: 5px;
      background: rgba(255,255,255,0.7);
      border: none;
      padding: 2px 6px;
      cursor: pointer;
      font-size: 16px;
      border-radius: 4px;
    }
    footer {
      text-align: center;
      padding: 1rem;
      font-size: 12px;
      color: #666;
    }
    /* 歌詞モーダル */
    #lyrics-modal {
      display: none;
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.7);
      z-index: 2000;
      justify-content: center;
      align-items: center;
    }
    #lyrics-box {
      background: #fff;
      max-width: 600px;
      width: 90%;
      max-height: 80vh;
      padding: 1rem;
      border-radius: 8px;
      overflow-y: auto;
      white-space: pre-line;
    }
    #lyrics-box h3 {
      margin-top: 0;
      text-align: center;
    }
    .lyrics-btn {
      margin-left: 8px;
      border: none;
      background: #8bbccc;
      color: #fff;
      padding: 2px 6px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 12px;
    }
    .lyrics-btn:hover {
      background: #7aa9b6;
    }
    /* ツリー用 */
    .folder {
      cursor: pointer;
      font-weight: bold;
      display: flex;
      align-items: center;
      gap: 5px;
    }
    .folder::before {
      content: "▶";
      display: inline-block;
      transition: transform 0.2s;
    }
    .folder.open::before {
      content: "▼";
    }
    .nested {
      display: none;
      margin-left: 1rem;
    }
    .nested.open {
      display: block;
    }
  </style>
</head>
<body>

<div id="auth">
  <h2>パスワードを入力してください</h2>
  <input type="password" id="password" placeholder="Password">
  <button onclick="checkPassword()">送信</button>
</div>

<div id="main-content" style="display:none;">
  <header>
    <h1>曲再生サイト</h1>
    <div id="japan-time" style="font-size:14px; margin-left:20px;"></div>
    <div class="creator-card">
      <img src="https://raw.githubusercontent.com/toganedev/D/main/discord_icon.png" alt="icon">
      <div>
        <div>togane_dev</div>
        <div style="font-size:12px;">1401421639106957464</div>
      </div>
    </div>
  </header>
  <main>
    <div class="controls">
      <button onclick="playRandom()">ランダム</button>
      <button onclick="prevTrack()">戻る</button>
      <button onclick="nextTrack()">スキップ</button>
      <button onclick="toggleRepeat()" id="repeat-btn">リピートOFF</button>
      <button onclick="toggleFavorites()" id="favorites-btn">⭐ お気に入りだけ</button>
      <button onclick="startPlayback()">▶ スタート</button>
      <button onclick="stopPlayback()">■ ストップ</button>
    </div>
    <div class="search-bar">
      <input type="text" id="search" placeholder="曲名検索..." oninput="filterTracks()">
    </div>
    <div class="now-playing" id="now-playing">再生中: なし\n次の曲: なし</div>
    <h2>曲一覧</h2>
    <ul id="track-list">読み込み中...</ul>
    <audio id="player" controls></audio>
  </main>
</div>

<div id="video-player">
  <video id="video-frame" muted playsinline webkit-playsinline></video>
  <button id="pip-btn">📺</button>
</div>

<!-- 歌詞モーダル -->
<div id="lyrics-modal">
  <div id="lyrics-box">
    <h3>歌詞</h3>
    <div id="lyrics-content"></div>
  </div>
</div>

<footer>
  ver2.2
</footer>

<script>
let tracks = []; 
let currentList = [];
let currentIndex = 0;
let isRepeat = false;
let nextTrackKey = null;
const repoOwner = "toganedev";
const repoName = "D";
const baseURL = `https://raw.githubusercontent.com/${repoOwner}/${repoName}/main/`;

let favorites = JSON.parse(localStorage.getItem("favorites") || "[]");
let showFavoritesOnly = false;
let lyricsData = [];

async function checkPassword() {
  const input = document.getElementById("password").value.trim();
  if (!input) return alert("パスワードを入力してください");

  const res = await fetch(baseURL + "password.txt");
  const text = await res.text();
  const lines = text.split(/\r?\n/).map(l => l.trim()).filter(l => l !== "");
  if (lines.includes(input)) {
    document.getElementById("auth").style.display = "none";
    document.getElementById("main-content").style.display = "block";
    loadTracks();
    loadLyrics();
    updateJapanTime();
  } else alert("パスワードが違います");
}

document.getElementById("password").addEventListener("keydown", e => {
  if (e.key === "Enter") checkPassword();
});

function updateJapanTime() {
  const now = new Date();
  const jst = new Date(now.getTime() + 9 * 60 * 60 * 1000);
  const y = jst.getUTCFullYear();
  const m = String(jst.getUTCMonth() + 1).padStart(2, "0");
  const d = String(jst.getUTCDate()).padStart(2, "0");
  const hh = String(jst.getUTCHours()).padStart(2, "0");
  const mm = String(jst.getUTCMinutes()).padStart(2, "0");
  const day = ["日","月","火","水","木","金","土"][jst.getUTCDay()];
  document.getElementById("japan-time").textContent = `${y}/${m}/${d}/${hh}:${mm}（${day}）`;
}

// フォルダツリー読み込み
async function loadTracks() {
  tracks = [];
  const listContainer = document.getElementById("track-list");
  listContainer.innerHTML = "";
  await buildFolderTree("", listContainer);
}

// 再帰的にフォルダツリーを作成
async function buildFolderTree(path, parentElement) {
  const url = `https://api.github.com/repos/${repoOwner}/${repoName}/contents/${path}`;
  const res = await fetch(url);
  const items = await res.json();

  for (let item of items) {
    if (item.type === "dir") {
      const li = document.createElement("li");
      const folder = document.createElement("div");
      folder.textContent = item.name;
      folder.className = "folder";
      const nested = document.createElement("ul");
      nested.className = "nested";

      folder.addEventListener("click", async () => {
        folder.classList.toggle("open");
        nested.classList.toggle("open");
        if (nested.childElementCount === 0) {
          await buildFolderTree(path + item.name + "/", nested);
        }
      });

      li.appendChild(folder);
      li.appendChild(nested);
      parentElement.appendChild(li);
    } else if (item.type === "file" && (item.name.endsWith(".mp4") || item.name.endsWith(".m4a"))) {
      const fullKey = path + item.name;
      tracks.push(fullKey);

      const li = document.createElement("li");
      const link = document.createElement("a");
      link.href = "#";
      link.textContent = item.name;
      link.addEventListener("click", e => {
        e.preventDefault();
        playTrack(baseURL + path + encodeURIComponent(item.name), fullKey);
      });

      const favBtn = document.createElement("button");
      favBtn.textContent = favorites.includes(fullKey) ? "⭐" : "☆";
      favBtn.style.marginLeft = "8px";
      favBtn.style.border = "none";
      favBtn.style.background = "transparent";
      favBtn.style.cursor = "pointer";
      favBtn.addEventListener("click", e => {
        e.stopPropagation();
        toggleFavorite(fullKey);
      });

      li.appendChild(link);
      li.appendChild(favBtn);

      const hasLyrics = lyricsData.some(entry => entry.file === item.name);
      if (hasLyrics) {
        const lyricsBtn = document.createElement("button");
        lyricsBtn.textContent = "歌詞";
        lyricsBtn.className = "lyrics-btn";
        lyricsBtn.addEventListener("click", e => {
          e.stopPropagation();
          showLyrics(item.name);
        });
        li.appendChild(lyricsBtn);
      }

      parentElement.appendChild(li);
    }
  }
}

async function loadLyrics() {
  try {
    const res = await fetch(baseURL + "kashi.json");
    lyricsData = await res.json();
  } catch (e) {
    console.error("歌詞データ読み込み失敗:", e);
  }
}

function showLyrics(fileName) {
  const entry = lyricsData.find(e => e.file === fileName);
  if (entry) {
    document.getElementById("lyrics-content").textContent = entry.lyrics;
    document.getElementById("lyrics-modal").style.display = "flex";
  }
}

document.getElementById("lyrics-modal").addEventListener("click", () => {
  document.getElementById("lyrics-modal").style.display = "none";
});

function toggleFavorite(track) {
  if (favorites.includes(track)) {
    favorites = favorites.filter(f => f !== track);
  } else favorites.push(track);

  localStorage.setItem("favorites", JSON.stringify(favorites));
  if (showFavoritesOnly) renderFavorites();
}

function toggleFavorites() {
  showFavoritesOnly = !showFavoritesOnly;
  document.getElementById("favorites-btn").textContent = showFavoritesOnly ? "📂 全曲表示" : "⭐ お気に入りだけ";
  if (showFavoritesOnly) renderFavorites();
  else loadTracks();
}

function renderFavorites() {
  const listContainer = document.getElementById("track-list");
  listContainer.innerHTML = "";
  favorites.forEach(file => {
    const fileName = file.split("/").pop();
    const li = document.createElement("li");
    const link = document.createElement("a");
    link.href = "#";
    link.textContent = fileName;
    link.addEventListener("click", e => {
      e.preventDefault();
      playTrack(baseURL + file, file);
    });

    const favBtn = document.createElement("button");
    favBtn.textContent = "⭐";
    favBtn.style.marginLeft = "8px";
    favBtn.style.border = "none";
    favBtn.style.background = "transparent";
    favBtn.style.cursor = "pointer";
    favBtn.addEventListener("click", e => {
      e.stopPropagation();
      toggleFavorite(file);
    });

    li.appendChild(link);
    li.appendChild(favBtn);
    listContainer.appendChild(li);
  });
}

async function playTrack(url, fileKey) {
  currentIndex = 0;
  currentList = [fileKey];
  const audioPlayer = document.getElementById("player");
  const videoFrame = document.getElementById("video-frame");
  const videoPlayer = document.getElementById("video-player");

  audioPlayer.src = url;
  videoFrame.src = url;
  audioPlayer.play();
  videoFrame.play();
  videoPlayer.style.display = "block";

  updateNowPlaying(fileKey);

  updateMediaSession(fileKey, url);

  audioPlayer.onended = () => {
    if (isRepeat) {
      audioPlayer.currentTime = 0;
      videoFrame.currentTime = 0;
      audioPlayer.play();
      videoFrame.play();
    } else if (nextTrackKey) {
      playTrack(baseURL + nextTrackKey, nextTrackKey);
    } else {
      videoPlayer.style.display = "none";
    }
  };
}

function updateNowPlaying(trackName) {
  const nextName = nextTrackKey ? nextTrackKey.split("/").pop() : "なし";
  document.getElementById("now-playing").textContent = `再生中: ${trackName}\n次の曲: ${nextName}`;
}

function playRandom() {
  const all = showFavoritesOnly ? favorites : tracks;
  if (all.length === 0) return;

  const randomIndex = Math.floor(Math.random() * all.length);
  const currentKey = all[randomIndex];
  let nextIndex = Math.floor(Math.random() * all.length);
  if (all.length > 1) {
    while (nextIndex === randomIndex) {
      nextIndex = Math.floor(Math.random() * all.length);
    }
  }
  nextTrackKey = all[nextIndex];

  playTrack(baseURL + currentKey, currentKey);
}

function nextTrack() {
  if (nextTrackKey) {
    const all = showFavoritesOnly ? favorites : tracks;
    const currentKey = nextTrackKey;
    let nextIndex = Math.floor(Math.random() * all.length);
    if (all.length > 1) {
      while (all[nextIndex] === currentKey) {
        nextIndex = Math.floor(Math.random() * all.length);
      }
    }
    nextTrackKey = all[nextIndex];
    playTrack(baseURL + currentKey, currentKey);
  }
}
let playHistory = [];  // 再生履歴を保存する配列

async function playTrack(url, fileKey) {
  // 履歴管理：同じ曲を連続で入れないようにする
  if (playHistory.length === 0 || playHistory[playHistory.length - 1] !== fileKey) {
    playHistory.push(fileKey);
  }

  currentIndex = 0;
  currentList = [fileKey];
  const audioPlayer = document.getElementById("player");
  const videoFrame = document.getElementById("video-frame");
  const videoPlayer = document.getElementById("video-player");

  audioPlayer.src = url;
  videoFrame.src = url;
  audioPlayer.play();
  videoFrame.play();
  videoPlayer.style.display = "block";

  updateNowPlaying(fileKey);
  updateMediaSession(fileKey, url);

  audioPlayer.onended = () => {
    if (isRepeat) {
      audioPlayer.currentTime = 0;
      videoFrame.currentTime = 0;
      audioPlayer.play();
      videoFrame.play();
    } else if (nextTrackKey) {
      playTrack(baseURL + nextTrackKey, nextTrackKey);
    } else {
      videoPlayer.style.display = "none";
    }
  };
}

function prevTrack() {
  if (playHistory.length > 1) {
    // 現在の曲を削除
    playHistory.pop();
    // 1つ前の曲を取り出す
    const prevKey = playHistory.pop();
    if (prevKey) {
      playTrack(baseURL + prevKey, prevKey);
    }
  } else {
    alert("前の曲はありません");
  }
}

function startPlayback() {
  document.getElementById("player").play();
  document.getElementById("video-frame").play();
}

function stopPlayback() {
  document.getElementById("player").pause();
  document.getElementById("video-frame").pause();
}

// === リピート切替 ===
function toggleRepeat() {
  isRepeat = !isRepeat;
  document.getElementById("repeat-btn").textContent = isRepeat ? "リピートON" : "リピートOFF";
}

// === PiP ===
document.getElementById("pip-btn").addEventListener("click", async () => {
  const video = document.getElementById("video-frame");
  if (document.pictureInPictureElement) {
    await document.exitPictureInPicture();
  } else {
    await video.requestPictureInPicture();
  }
});

// === Media Session API ===
async function updateMediaSession(fileName, url) {
  let artwork = [{ src: "https://raw.githubusercontent.com/toganedev/D/main/discord_icon.png", sizes: "512x512", type: "image/png" }];

  if (fileName.endsWith(".mp4")) {
    try {
      artwork = [{ src: await getThumbnail(url, 7), sizes: "512x512", type: "image/png" }];
    } catch (e) {
      console.warn("サムネイル生成失敗", e);
    }
  }

  if ("mediaSession" in navigator) {
    navigator.mediaSession.metadata = new MediaMetadata({
      title: fileName.split("/").pop(),
      artist: "再生サイト",
      album: "再生中",
      artwork: artwork
    });

    navigator.mediaSession.setActionHandler("nexttrack", () => nextTrack());
    navigator.mediaSession.setActionHandler("previoustrack", () => prevTrack());
  }
}

// === mp4 サムネイル生成（7秒地点）===
function getThumbnail(url, seconds = 7) {
  return new Promise((resolve, reject) => {
    const video = document.createElement("video");
    video.src = url;
    video.crossOrigin = "anonymous";
    video.muted = true;

    video.addEventListener("loadedmetadata", () => {
      if (seconds > video.duration) seconds = Math.floor(video.duration / 2);
      video.currentTime = seconds;
    });

    video.addEventListener("seeked", () => {
      const canvas = document.createElement("canvas");
      canvas.width = video.videoWidth / 4;
      canvas.height = video.videoHeight / 4;
      const ctx = canvas.getContext("2d");
      ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
      resolve(canvas.toDataURL("image/png"));
    });

    video.addEventListener("error", reject);
  });
}
</script>
</body>
</html>
